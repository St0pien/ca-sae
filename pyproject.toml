[project]
name = "ca-sae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Jakub Stępień", email = "jstepien50@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "clip",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "ipykernel>=7.3.0",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.2",
    "lapsum",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
lapsum = { path = "packages/LapSum/lapsum" }
